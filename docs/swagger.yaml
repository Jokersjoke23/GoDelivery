basePath: /api
definitions:
  domain.AssignRoleRequest:
    properties:
      role:
        $ref: '#/definitions/domain.UserRole'
    required:
    - role
    type: object
  domain.AuthResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/domain.UserResponse'
    type: object
  domain.Courier:
    properties:
      created_at:
        type: string
      id:
        type: string
      location_lat:
        type: number
      location_lng:
        type: number
      status:
        $ref: '#/definitions/domain.CourierStatus'
      updated_at:
        type: string
      user:
        $ref: '#/definitions/domain.User'
      user_id:
        type: string
    type: object
  domain.CourierLocationRequest:
    properties:
      lat:
        type: number
      lng:
        type: number
    required:
    - lat
    - lng
    type: object
  domain.CourierStatus:
    enum:
    - online
    - offline
    - busy
    type: string
    x-enum-varnames:
    - CourierStatusOnline
    - CourierStatusOffline
    - CourierStatusBusy
  domain.CreateMenuItemRequest:
    properties:
      is_available:
        type: boolean
      name_en:
        minLength: 2
        type: string
      name_ru:
        minLength: 2
        type: string
      price:
        minimum: 0
        type: number
    required:
    - name_en
    - name_ru
    - price
    type: object
  domain.CreateOrderItemRequest:
    properties:
      menu_item_id:
        type: string
      quantity:
        minimum: 1
        type: integer
    required:
    - menu_item_id
    - quantity
    type: object
  domain.CreateOrderRequest:
    properties:
      address:
        type: string
      items:
        items:
          $ref: '#/definitions/domain.CreateOrderItemRequest'
        minItems: 1
        type: array
      payment_method:
        $ref: '#/definitions/domain.PaymentMethod'
      restaurant_id:
        type: string
    required:
    - address
    - items
    - payment_method
    - restaurant_id
    type: object
  domain.CreateRestaurantRequest:
    properties:
      address:
        type: string
      name_en:
        minLength: 2
        type: string
      name_ru:
        minLength: 2
        type: string
      phone:
        minLength: 10
        type: string
    required:
    - address
    - name_en
    - name_ru
    - phone
    type: object
  domain.CreateUserRequest:
    properties:
      email:
        type: string
      name:
        minLength: 2
        type: string
      password:
        minLength: 6
        type: string
      phone:
        minLength: 10
        type: string
    required:
    - email
    - name
    - password
    - phone
    type: object
  domain.Delivery:
    properties:
      courier:
        $ref: '#/definitions/domain.Courier'
      courier_id:
        type: string
      created_at:
        type: string
      delivered_at:
        type: string
      id:
        type: string
      order:
        $ref: '#/definitions/domain.Order'
      order_id:
        type: string
      picked_up_at:
        type: string
      status:
        $ref: '#/definitions/domain.DeliveryStatus'
      updated_at:
        type: string
    type: object
  domain.DeliveryStatus:
    enum:
    - waiting
    - assigned
    - picked_up
    - on_the_way
    - delivered
    - failed
    type: string
    x-enum-varnames:
    - DeliveryStatusWaiting
    - DeliveryStatusAssigned
    - DeliveryStatusPickedUp
    - DeliveryStatusOnTheWay
    - DeliveryStatusDelivered
    - DeliveryStatusFailed
  domain.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  domain.MenuItem:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_available:
        type: boolean
      name:
        type: string
      name_en:
        type: string
      name_ru:
        type: string
      price:
        type: number
      restaurant_id:
        type: string
      updated_at:
        type: string
    type: object
  domain.Order:
    properties:
      address:
        type: string
      created_at:
        type: string
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/domain.OrderItem'
        type: array
      payment_method:
        $ref: '#/definitions/domain.PaymentMethod'
      payment_status:
        $ref: '#/definitions/domain.PaymentStatus'
      restaurant:
        $ref: '#/definitions/domain.Restaurant'
      restaurant_id:
        type: string
      status:
        $ref: '#/definitions/domain.OrderStatus'
      total_price:
        type: number
      updated_at:
        type: string
      user:
        $ref: '#/definitions/domain.User'
      user_id:
        type: string
    type: object
  domain.OrderItem:
    properties:
      created_at:
        type: string
      id:
        type: string
      menu_item:
        $ref: '#/definitions/domain.MenuItem'
      menu_item_id:
        type: string
      order_id:
        type: string
      price:
        type: number
      quantity:
        type: integer
      updated_at:
        type: string
    type: object
  domain.OrderStatus:
    enum:
    - pending
    - accepted
    - preparing
    - ready
    - picked_up
    - on_the_way
    - delivered
    - cancelled
    - rejected
    type: string
    x-enum-varnames:
    - OrderStatusPending
    - OrderStatusAccepted
    - OrderStatusPreparing
    - OrderStatusReady
    - OrderStatusPickedUp
    - OrderStatusOnTheWay
    - OrderStatusDelivered
    - OrderStatusCancelled
    - OrderStatusRejected
  domain.PaymentMethod:
    enum:
    - cash
    - card
    - online
    type: string
    x-enum-varnames:
    - PaymentMethodCash
    - PaymentMethodCard
    - PaymentMethodOnline
  domain.PaymentStatus:
    enum:
    - pending
    - paid
    - failed
    - refunded
    type: string
    x-enum-varnames:
    - PaymentStatusPending
    - PaymentStatusPaid
    - PaymentStatusFailed
    - PaymentStatusRefunded
  domain.Restaurant:
    properties:
      address:
        type: string
      created_at:
        type: string
      id:
        type: string
      menu_items:
        items:
          $ref: '#/definitions/domain.MenuItem'
        type: array
      name:
        type: string
      name_en:
        type: string
      name_ru:
        type: string
      owner:
        $ref: '#/definitions/domain.User'
      owner_id:
        type: string
      phone:
        type: string
      status:
        $ref: '#/definitions/domain.RestaurantStatus'
      updated_at:
        type: string
    type: object
  domain.RestaurantStatus:
    enum:
    - active
    - inactive
    - closed
    type: string
    x-enum-varnames:
    - RestaurantStatusActive
    - RestaurantStatusInactive
    - RestaurantStatusClosed
  domain.UpdateMenuItemRequest:
    properties:
      is_available:
        type: boolean
      name_en:
        type: string
      name_ru:
        type: string
      price:
        type: number
    type: object
  domain.UpdateOrderStatusRequest:
    properties:
      status:
        $ref: '#/definitions/domain.OrderStatus'
    required:
    - status
    type: object
  domain.UpdateRestaurantRequest:
    properties:
      address:
        type: string
      name_en:
        type: string
      name_ru:
        type: string
      phone:
        type: string
      status:
        $ref: '#/definitions/domain.RestaurantStatus'
    type: object
  domain.UpdateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      phone:
        type: string
    type: object
  domain.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      phone:
        type: string
      role:
        $ref: '#/definitions/domain.UserRole'
      updated_at:
        type: string
    type: object
  domain.UserResponse:
    properties:
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      phone:
        type: string
      role:
        $ref: '#/definitions/domain.UserRole'
    type: object
  domain.UserRole:
    enum:
    - admin
    - customer
    - courier
    type: string
    x-enum-varnames:
    - UserRoleAdmin
    - UserRoleCustomer
    - UserRoleCourier
  response.ErrorResponse:
    properties:
      error:
        type: string
      success:
        type: boolean
    type: object
  response.SuccessResponse:
    properties:
      data: {}
      success:
        type: boolean
    type: object
host: localhost:8080
info:
  contact: {}
  description: REST API для сервиса доставки еды
  title: GoDelivery API
  version: "1.0"
paths:
  /admin/couriers/online:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Courier'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Онлайн курьеры (admin)
      tags:
      - couriers
  /admin/orders/{id}/status:
    put:
      consumes:
      - application/json
      parameters:
      - description: ID заказа
        in: path
        name: id
        required: true
        type: string
      - description: Новый статус
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.UpdateOrderStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Обновить статус заказа (admin)
      tags:
      - orders
  /admin/users:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.UserResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Все пользователи (admin)
      tags:
      - users
  /admin/users/{id}:
    delete:
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удалить пользователя (admin)
      tags:
      - users
  /admin/users/{id}/role:
    put:
      consumes:
      - application/json
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: string
      - description: Роль
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.AssignRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Назначить роль пользователю (admin)
      tags:
      - users
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email и пароль
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Вход в систему
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные пользователя
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Регистрация
      tags:
      - auth
  /couriers:
    post:
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Courier'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Создать профиль курьера
      tags:
      - couriers
  /couriers/me:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удалить профиль курьера
      tags:
      - couriers
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Courier'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Мой профиль курьера
      tags:
      - couriers
  /couriers/me/deliveries:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Delivery'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Мои доставки (курьер)
      tags:
      - deliveries
  /couriers/me/location:
    put:
      consumes:
      - application/json
      parameters:
      - description: Координаты
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.CourierLocationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Обновить геолокацию курьера
      tags:
      - couriers
  /couriers/me/status:
    put:
      consumes:
      - application/json
      parameters:
      - description: Новый статус
        in: body
        name: input
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Обновить статус курьера
      tags:
      - couriers
  /deliveries/{id}:
    get:
      parameters:
      - description: ID доставки
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Delivery'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Доставка по ID
      tags:
      - deliveries
  /deliveries/{id}/status:
    put:
      consumes:
      - application/json
      parameters:
      - description: ID доставки
        in: path
        name: id
        required: true
        type: string
      - description: Новый статус
        in: body
        name: input
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Обновить статус доставки
      tags:
      - deliveries
  /orders:
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные заказа
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Order'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Создать заказ
      tags:
      - orders
  /orders/{id}:
    get:
      parameters:
      - description: ID заказа
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Order'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Заказ по ID
      tags:
      - orders
  /orders/{id}/cancel:
    post:
      parameters:
      - description: ID заказа
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Отменить заказ
      tags:
      - orders
  /orders/{id}/delivery:
    get:
      parameters:
      - description: ID заказа
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Delivery'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Доставка по заказу
      tags:
      - deliveries
  /orders/my:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Order'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Мои заказы
      tags:
      - orders
  /restaurants:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Restaurant'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Все рестораны
      tags:
      - restaurants
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные ресторана
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.CreateRestaurantRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Restaurant'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Создать ресторан
      tags:
      - restaurants
  /restaurants/{id}:
    delete:
      parameters:
      - description: ID ресторана
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удалить ресторан
      tags:
      - restaurants
    get:
      parameters:
      - description: ID ресторана
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Restaurant'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Ресторан по ID
      tags:
      - restaurants
    put:
      consumes:
      - application/json
      parameters:
      - description: ID ресторана
        in: path
        name: id
        required: true
        type: string
      - description: Данные для обновления
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.UpdateRestaurantRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Restaurant'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Обновить ресторан
      tags:
      - restaurants
  /restaurants/{id}/menu:
    post:
      consumes:
      - application/json
      parameters:
      - description: ID ресторана
        in: path
        name: id
        required: true
        type: string
      - description: Данные блюда
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.CreateMenuItemRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.MenuItem'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Добавить блюдо в меню
      tags:
      - restaurants
  /restaurants/{id}/orders:
    get:
      parameters:
      - description: ID ресторана
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Order'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Заказы ресторана
      tags:
      - orders
  /restaurants/menu/{itemID}:
    delete:
      parameters:
      - description: ID блюда
        in: path
        name: itemID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
